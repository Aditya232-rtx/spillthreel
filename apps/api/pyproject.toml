[project]
name = "spillthereel-api"
version = "0.1.0"
description = "SpillTheReel backend — FastAPI + pgvector + Gemini pipeline"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "UNLICENSED" }

dependencies = [
  # Web framework
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "python-multipart>=0.0.9",
  # Validation / config
  "pydantic>=2.10",
  "pydantic-settings>=2.6",
  # Persistence
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "ulid-py>=1.1",
  # Auth — Supabase JWT verification (asymmetric ES256/RS256 via JWKS +
  # legacy HS256 fallback). PyJWT[crypto] pulls in cryptography for EC/RSA.
  "pyjwt[crypto]>=2.10",
  # Observability
  "structlog>=24.4",
  "sentry-sdk[fastapi]>=2.19",
  # HTTP client
  "httpx>=0.28",
  # Utilities
  "python-dotenv>=1.0",
  "slowapi>=0.1.10",
  # Vector embeddings
  "pgvector>=0.2.0",
  # IG export parser (BeautifulSoup HTML) — needed in the api image too:
  # POST /v1/imports parses the upload inline before enqueueing.
  "beautifulsoup4>=4.12",
  "lxml>=5.3",
]

[project.optional-dependencies]
worker = [
  # LLM providers
  "google-genai>=1.3",
  "groq>=0.14",
  # Media extraction (bundled in worker container only)
  "yt-dlp>=2026.8.19",
  "gallery-dl>=1.28",
  # GCP
  # google-auth is explicit (not just transitive via google-cloud-*):
  # app/tasks/worker_entry.py imports it directly for Cloud Tasks OIDC verification.
  "google-auth>=2.0",
  "google-cloud-tasks>=2.17",
  "google-cloud-storage>=2.19",
  "google-cloud-logging>=3.11",
]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "ruff>=0.8",
  "mypy>=1.13",
  "beautifulsoup4>=4.12",
  "types-beautifulsoup4>=4.12",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]  # line length handled by formatter

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

# yt-dlp and asyncpg ship no type stubs (and typeshed has none).
# Standard idiom: don't punish our code for untyped third-party imports.
[[tool.mypy.overrides]]
module = ["yt_dlp.*", "asyncpg.*"]
ignore_missing_imports = true

# Worker-only deps (google-genai, groq, google-auth live in the `worker`
# extra): the api image stays lean via deferred (function-level) imports,
# and api-ci syncs `--extra dev` only. Tell mypy the imports are
# intentionally absent here rather than installing worker deps into CI.
[[tool.mypy.overrides]]
module = ["groq.*", "google.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
