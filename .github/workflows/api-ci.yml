name: api-ci

on:
  push:
    branches: [main]
    paths: ["apps/api/**", ".github/workflows/api-ci.yml"]
  pull_request:
    paths: ["apps/api/**", ".github/workflows/api-ci.yml"]

permissions:
  contents: read

concurrency:
  group: api-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Same extension set as local dev (pgvector image) so the
        # pgvector round-trip test runs for real, not skipped.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: spill
          POSTGRES_PASSWORD: spill
          POSTGRES_DB: spillthereel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spill -d spillthereel"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies (incl. dev extra)
        working-directory: apps/api
        # NOTE: dev tools (pytest/ruff/mypy) live in the `dev`
        # optional-dependencies extra — plain `uv sync` skips extras.
        run: uv sync --frozen --extra dev

      - name: Ruff check
        working-directory: apps/api
        run: uv run ruff check .

      - name: Ruff format check
        working-directory: apps/api
        run: uv run ruff format --check .

      - name: Mypy
        working-directory: apps/api
        run: uv run mypy app/

      - name: Pytest
        working-directory: apps/api
        env:
          ENVIRONMENT: dev
          SUPABASE_URL: https://test.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_test
          SUPABASE_SECRET_KEY: sb_secret_test
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/postgres
          TEST_DATABASE_URL: postgresql://spill:spill@localhost:5432/spillthereel
        run: uv run pytest -q
