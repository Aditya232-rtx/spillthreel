# Local dev stack — used by scripts/local-dev.sh.
#
# Values come from the shell environment. local-dev.sh exports them from
# apps/api/.env (default, prod values) or --env apps/api/.env.staging
# before invoking compose, so `docker compose config` needs that file
# sourced (or exported vars) to resolve.
#
# Data plane is LOCAL Postgres (container below). Identity plane is
# Supabase Cloud Auth (JWTs verify offline via JWKS) — there is no
# Firebase, no Cloud SQL, no local Auth emulator in this architecture.

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: spill
      POSTGRES_PASSWORD: spill
      POSTGRES_DB: spillthereel
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spill -d spillthereel"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./apps/api
    environment:
      ENVIRONMENT: dev
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
      # Local container Postgres — overrides any cloud DATABASE_URL from
      # the env file. Direct/migration URLs pass through untouched.
      DATABASE_URL: postgresql+asyncpg://spill:spill@postgres:5432/spillthereel
      DATABASE_URL_DIRECT: ${DATABASE_URL_DIRECT:-}
      # --- Supabase (Auth verify via JWKS, Storage client) ---
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-}
      SUPABASE_LEGACY_JWT_SECRET: ${SUPABASE_LEGACY_JWT_SECRET:-}
      SUPABASE_BUCKET_MEDIA: ${SUPABASE_BUCKET_MEDIA:-media}
      SUPABASE_BUCKET_EXPORTS: ${SUPABASE_BUCKET_EXPORTS:-exports}
      # --- Extractors / LLM / memory (empty = code paths that need them fail loudly) ---
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      # --- Observability / guards ---
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      GIT_SHA: ${GIT_SHA:-}
      RATE_LIMIT_DEFAULT: ${RATE_LIMIT_DEFAULT:-60/minute}
      RATE_LIMIT_SAVES: ${RATE_LIMIT_SAVES:-10/minute}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/app:cached
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  worker:
    build:
      context: ./apps/api
    environment:
      ENVIRONMENT: dev
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
      # Standalone worker ASGI app (TF worker sets APP_MODULE=app.worker:app;
      # the command below selects it explicitly for local dev).
      APP_MODULE: app.worker:app
      PORT: 8001
      # Same local container Postgres as the api service.
      DATABASE_URL: postgresql+asyncpg://spill:spill@postgres:5432/spillthereel
      DATABASE_URL_DIRECT: ${DATABASE_URL_DIRECT:-}
      # --- Supabase (Auth verify via JWKS, Storage client) ---
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-}
      SUPABASE_LEGACY_JWT_SECRET: ${SUPABASE_LEGACY_JWT_SECRET:-}
      SUPABASE_BUCKET_MEDIA: ${SUPABASE_BUCKET_MEDIA:-media}
      SUPABASE_BUCKET_EXPORTS: ${SUPABASE_BUCKET_EXPORTS:-exports}
      # --- Extractors / LLM / memory (empty = code paths that need them fail loudly) ---
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      # --- Observability / guards ---
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      GIT_SHA: ${GIT_SHA:-}
      RATE_LIMIT_DEFAULT: ${RATE_LIMIT_DEFAULT:-60/minute}
      RATE_LIMIT_SAVES: ${RATE_LIMIT_SAVES:-10/minute}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8001:8001"
    volumes:
      - ./apps/api:/app:cached
    command: >
      sh -c "alembic upgrade head &&
              uvicorn app.worker:app --host 0.0.0.0 --port 8001 --reload"

  # Runs one bounded outbox batch at a time. In dev mode the dispatcher
  # executes handlers under a renewable DB lease; API requests only persist
  # intents and return. Restarting this process leaves unfinished rows due.
  dispatcher:
    build:
      context: ./apps/api
    environment:
      ENVIRONMENT: dev
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
      DATABASE_URL: postgresql+asyncpg://spill:spill@postgres:5432/spillthereel
      DATABASE_URL_DIRECT: ${DATABASE_URL_DIRECT:-}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-}
      SUPABASE_LEGACY_JWT_SECRET: ${SUPABASE_LEGACY_JWT_SECRET:-}
      SUPABASE_BUCKET_MEDIA: ${SUPABASE_BUCKET_MEDIA:-media}
      SUPABASE_BUCKET_EXPORTS: ${SUPABASE_BUCKET_EXPORTS:-exports}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      APIFY_API_TOKEN: ${APIFY_API_TOKEN:-}
      BRIGHTDATA_API_TOKEN: ${BRIGHTDATA_API_TOKEN:-}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      SCRAPER_PROVIDER: ${SCRAPER_PROVIDER:-none}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      GIT_SHA: ${GIT_SHA:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./apps/api:/app:cached
    command:
      - /bin/sh
      - -c
      - >-
        while true; do
        python -m app.tasks.dispatch_due --limit 50;
        status=$$?;
        if [ "$$status" -eq 0 ]; then sleep 1; else sleep 5; fi;
        done

volumes:
  pg_data:
